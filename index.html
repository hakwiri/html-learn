<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Dev Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome back, Akwirih! Ready to code today?</h1>
    <p id="goal">Today's Goal: Finish CSS Animations</p>
    <p id="streak">7-Day Coding Streak 🔥 Unstoppable!</p>
  </header>

  <section id="progress">
    <div class="card html">HTML Hero <span id="htmlProgress">72%</span></div>
    <div class="card css">CSS Stylist <span id="cssProgress">45%</span></div>
    <div class="card js">JavaScript Ninja <span id="jsProgress">30%</span></div>
  </section>

  <section id="leaderboard">
    <h2>Leaderboard</h2>
    <ul id="leaderList"></ul>
  </section>

  <footer>
    <button id="plannerBtn">View Planner</button>
    <button id="projectsBtn">Track Projects</button>
    <button id="shareBtn">Share Achievements</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
